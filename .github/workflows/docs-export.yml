name: docs-export

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Generated map PR number; leave all identity inputs empty for ordinary manual runs
        type: string
        default: ""
      expected-head:
        description: Exact generated PR head commit
        type: string
        default: ""
      expected-base:
        description: Exact staging source commit
        type: string
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated:
    if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/automation/map-') || inputs.pull-request != '' || inputs.expected-head != '' || inputs.expected-base != '')
    uses: unset-sh/tooling/.github/workflows/ci-branch-policy.yml@153b73d8bc6eadddeb50152835ed3daef44f564b
    permissions: {}
    with:
      pull-request: ${{ inputs.pull-request }}
      expected-head: ${{ inputs.expected-head }}
      expected-base: ${{ inputs.expected-base }}

  check:
    needs: verify-generated
    if: always() && !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Bootstrap pin to the reviewed tooling implementation; select a released pin when one is approved.
    uses: unset-sh/tooling/.github/workflows/ci-check.yml@838a965d14d0887291046c279422becb7b0228f3
    permissions:
      contents: read
    with:
      install: false
      command: ${{ (github.event_name != 'workflow_dispatch' || (!startsWith(github.ref, 'refs/heads/automation/map-') && inputs.pull-request == '' && inputs.expected-head == '' && inputs.expected-base == '') || needs.verify-generated.result == 'success') && 'bun run map && bun run check' || 'exit 1' }}
  export:
    needs: check
    if: always() && !cancelled() && needs.check.result == 'success'
    uses: unset-sh/tooling/.github/workflows/automation-docs-export.yml@838a965d14d0887291046c279422becb7b0228f3
    permissions:
      contents: read
