name: docs-export

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Bootstrap pin to the reviewed tooling implementation; select a released pin when one is approved.
    uses: unset-sh/tooling/.github/workflows/ci-check.yml@0366edb2d04d5c24c19319770893b413d172567b
    permissions:
      contents: read
  export:
    needs: check
    uses: unset-sh/tooling/.github/workflows/automation-docs-export.yml@0366edb2d04d5c24c19319770893b413d172567b
    permissions:
      contents: read
