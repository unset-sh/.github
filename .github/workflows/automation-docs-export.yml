# Generated by scripts/workflows.mjs from automation/docs-export.yml; do not edit.
name: docs-export

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run check
      - name: Export committed public documentation
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: npm run docs:export -- --revision "$SOURCE_REVISION" --out "$RUNNER_TEMP/docs-export"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-docs-${{ github.sha }}
          path: ${{ runner.temp }}/docs-export
          if-no-files-found: error
          retention-days: 14
