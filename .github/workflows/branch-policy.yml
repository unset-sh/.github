name: branch-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

  workflow_dispatch:
    inputs:
      pull-request:
        description: Generated map PR number; all three identity inputs are required for dispatch
        type: string
        required: true
      expected-head:
        description: Exact generated PR head commit
        type: string
        required: true
      expected-base:
        description: Exact main source commit
        type: string
        required: true

permissions: {}

jobs:
  policy:
    permissions:
      contents: read
    uses: unset-sh/tooling/.github/workflows/ci-branch-policy.yml@9239c7b752a92fc1eb3de3a0e86193fce7c4bda3
    with:
      pull-request: ${{ inputs.pull-request }}
      expected-head: ${{ inputs.expected-head }}
      expected-base: ${{ inputs.expected-base }}
      # .github has no staging branch (org-0010): every pull request targets main.
      flow: main
