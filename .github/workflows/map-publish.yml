name: map-publish

on:
  push:
    branches: [staging]
    paths:
      - repos.json
      - scripts/**
      - package.json
      - MAP.md
      - profile/README.md
      - .github/maps.json
      - .github/workflows/map-publish.yml
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: map-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/staging'
    uses: unset-sh/tooling/.github/workflows/automation-org-map.yml@153b73d8bc6eadddeb50152835ed3daef44f564b
    permissions:
      contents: write
      pull-requests: write
      actions: write
