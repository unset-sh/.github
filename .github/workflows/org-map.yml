name: org-map

# check: on every pull request and push, regenerate the map from repos.json and
#        validate the result. map-publish prepares a checked staging PR for committed views.
# drift: every day and on demand, compares repos.json with the organisation's
#        public repositories and keeps one issue labelled org-map-drift open
#        while they differ, closing it once they match again.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [staging, main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      pull-request:
        description: Generated map PR number; leave all identity inputs empty for ordinary manual runs
        type: string
        default: ""
      expected-head:
        description: Exact generated PR head commit
        type: string
        default: ""
      expected-base:
        description: Exact staging source commit
        type: string
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated:
    if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/automation/map-') || inputs.pull-request != '' || inputs.expected-head != '' || inputs.expected-base != '')
    uses: unset-sh/tooling/.github/workflows/ci-branch-policy.yml@153b73d8bc6eadddeb50152835ed3daef44f564b
    permissions: {}
    with:
      pull-request: ${{ inputs.pull-request }}
      expected-head: ${{ inputs.expected-head }}
      expected-base: ${{ inputs.expected-base }}

  check:
    name: Check the organisation map
    needs: verify-generated
    if: always() && !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/automation/map-') || inputs.pull-request != '' || inputs.expected-head != '' || inputs.expected-base != '')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail the required check if generated PR verification failed
        if: (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/automation/map-') || inputs.pull-request != '' || inputs.expected-head != '' || inputs.expected-base != '')) && needs.verify-generated.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version .bun-version names
        env:
          BUN_VERSION_FILE: .bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - run: |
          bun run map
          bun run check
      - name: Verify that the generated PR already contains the exact rendered views
        if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/automation/map-') || inputs.pull-request != '' || inputs.expected-head != '' || inputs.expected-base != '')
        run: git diff --exit-code -- MAP.md profile/README.md

  drift:
    name: Compare the map with GitHub
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/automation/map-') && inputs.pull-request == '' && inputs.expected-head == '' && inputs.expected-base == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version .bun-version names
        env:
          BUN_VERSION_FILE: .bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - name: Compare and keep the drift issue current
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          bun scripts/drift.mjs "$RUNNER_TEMP/drift.md"
          status=$?
          set -e
          open=$(gh issue list --label org-map-drift --state open --json number --jq '.[0].number // empty')
          if [ "$status" -eq 0 ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "The map matches GitHub again."; fi
            exit 0
          fi
          if [ "$status" -ne 3 ]; then
            echo "::error::The drift check itself failed (exit $status)."
            exit "$status"
          fi
          gh label create org-map-drift --color D93F0B --description "repos.json no longer matches GitHub" --force
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file "$RUNNER_TEMP/drift.md"
          else
            gh issue create --title "Organisation map is out of date" --label org-map-drift --body-file "$RUNNER_TEMP/drift.md"
          fi
          echo "::warning::The organisation map no longer matches GitHub; see the org-map-drift issue."
