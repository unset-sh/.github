name: Accessibility barrier
description: Report a barrier to using a project or its documentation.
body:
  - type: markdown
    attributes:
      value: |
        Describe the task and the barrier; you do not need to disclose a disability or medical information.
        Remove secrets and private personal data from examples and attachments. See the [accessibility guidance](https://github.com/unset-sh/.github/blob/main/ACCESSIBILITY.md).
        Report possible vulnerabilities through the [security policy](https://github.com/unset-sh/.github/blob/main/SECURITY.md).
  - type: textarea
    id: barrier
    attributes:
      label: What were you trying to do, and what blocked you?
      description: Name the page, screen or command and describe the barrier.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we find or reproduce the barrier?
      description: Give the steps, a public page link or another safe example. Describe what would let you complete the task.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment, if relevant
      description: Optional browser, operating system, assistive technology and versions. Include only what you are comfortable sharing.
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Optional redacted screenshots, recordings or related issues. A workaround is useful to mention but not required.
