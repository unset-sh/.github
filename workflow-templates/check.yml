name: ci

on:
  pull_request:
  push:
    branches: [$default-branch]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: unset-sh/.github/.github/workflows/ci-check.yml@APPROVED_COMMIT_SHA
    permissions:
      contents: read
    with:
      install: false # Set true for npm ci --ignore-scripts; keep false with no dependencies.
